[project]
name = "mcp-relay"
version = "0.1.0"
description = "Relay MCP servers running on your machine to a Databricks workspace."
readme = "README.md"
license = "MIT"
authors = [
    { name = "root", email = "root@localhost" }
]
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.30",
    "mcp>=1.2,<2",
    "python-dotenv>=1",
    "websockets>=13",
]

[project.scripts]
mcp-relay = "mcp_relay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/mcp_relay.py"]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"resources" = "mcp_relay_resources"
